<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Site client (CSS hostile)</title>
    <!--
      Playwright's demo host (e2e/widget.spec.ts) — deliberately aggressive
      host-page CSS to prove Shadow DOM isolation actually holds both ways
      (DoD: "page hôte de démonstration au CSS agressif"), not just on a
      blank page. Separate from widget-preview-host.html (the Configurator's
      clean live-preview iframe): mixing hostile CSS into that one would
      visibly break the Configurator's own preview.

      Every rule below targets ONLY this page's own light-DOM content
      (marked zb-e2e-* to avoid any accidental collision with the kit's own
      .zb-* class names) — none of it can reach into the widget's shadow
      root, and none of the widget's own styles can leak out here either.
    -->
    <style>
      /* Aggressive, unscoped resets a real hostile site might ship. */
      * {
        box-sizing: content-box !important;
        font-family: 'Comic Sans MS', cursive !important;
        line-height: 3 !important;
        color: red !important;
      }
      button {
        all: unset !important;
        border: 5px dashed lime !important;
        background: yellow !important;
      }
      .zb-e2e-decoy {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: rgba(255, 0, 255, 0.15);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1 class="zb-e2e-title">Site client de démonstration</h1>
    <p>Cette page simule un site hôte au CSS agressif pour vérifier l'isolation Shadow DOM du widget.</p>
    <div class="zb-e2e-decoy" aria-hidden="true"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var script = document.createElement('script');
        script.id = 'zb-widget-script';
        script.src = '/dist-widget/widget.js';
        script.async = true;
        script.dataset.embedKey = params.get('embedKey') || 'wgt_demo_active';
        script.dataset.position = params.get('position') || 'bottom-right';
        script.dataset.accent = params.get('accent') || 'var(--iris-700)';
        script.dataset.radius = params.get('radius') || '14';
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
